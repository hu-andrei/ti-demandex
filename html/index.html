<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07090f" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Portal interno para abertura de demandas de Tecnologia da Informação." />
  <title>Portal de Demandas | TI Hungaro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fira+Sans:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=block" rel="stylesheet" />
  <style id="remove-first-load-flicker">
    /* Impede o primeiro frame com a fonte de reserva antes das fontes da interface. */
    html.fonts-loading body { visibility: hidden; }
    html.fonts-loading .portal-shell { opacity: 0; }
    /* Os cards não podem iniciar enquanto a interface ainda está oculta. */
    html.fonts-loading .team-card,
    html.fonts-ready .team-card {
      opacity: 0;
      transform: translate3d(0, 18px, 0) scale(.985);
      animation: none !important;
    }
    html.fonts-ready .portal-shell { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      html.fonts-ready .team-card { opacity: 1; animation: none; }
    }
  </style>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>

  <main class="portal-shell">
    <section class="portal" aria-label="Seleção de equipe e template de demanda">
      <div class="portal-heading">
        <div class="brand-mark portal-heading__icon" aria-hidden="true">TI</div>
        <div>
          <span class="portal-heading__title">PORTAL DE DEMANDAS</span>
          <p class="portal-heading__description">Selecione uma equipe para visualizar os formulários disponíveis.</p>
        </div>
        <button class="portal-heading__back" type="button" aria-label="Voltar" hidden>
          <span aria-hidden="true">←</span> Voltar
        </button>
        <div class="view-switcher" role="group" aria-label="Formato de apresentação">
          <button class="view-switcher__button is-active" type="button" data-view="grid" aria-label="Exibir em grade" aria-pressed="true" title="Exibir em grade">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          </button>
          <button class="view-switcher__button" type="button" data-view="list" aria-label="Exibir em lista" aria-pressed="false" title="Exibir em lista">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
          </button>
        </div>
        <button class="theme-toggle" type="button" aria-label="Ativar modo claro" aria-pressed="false" title="Ativar modo claro" hidden>
          <svg class="theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/></svg>
        </button>
        <div class="settings">
          <button class="settings-toggle" type="button" aria-label="Abrir configurações" aria-expanded="false" aria-controls="settings-panel" title="Configurações">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.1 2.1-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1 1.55V20h-3v-.08a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06-2.1-2.1.06-.06A1.7 1.7 0 0 0 7.12 15a1.7 1.7 0 0 0-1.55-1H5.5v-3h.08a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.1-2.1.06.06a1.7 1.7 0 0 0 1.88.34h.01a1.7 1.7 0 0 0 1-1.55V4.7h3v.08a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.1 2.1-.06.06A1.7 1.7 0 0 0 19.4 10v.01a1.7 1.7 0 0 0 1.55 1h.08v3h-.08a1.7 1.7 0 0 0-1.55 1Z"/></svg>
          </button>
          <form id="settings-panel" class="settings-panel" hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <div class="settings-panel__surface">
              <div class="settings-panel__header">
                <div><span>PORTAL DE DEMANDAS</span><h2 id="settings-title">Configurações</h2></div>
                <button class="settings-close" type="button" aria-label="Fechar configurações">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
                </button>
              </div>
              <div class="settings-tabs" role="tablist" aria-label="Seções de configurações">
                <button class="settings-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="settings-profile" id="settings-tab-profile" data-settings-tab="profile">Perfil</button>
                <button class="settings-tab" type="button" role="tab" aria-selected="false" aria-controls="settings-appearance" id="settings-tab-appearance" data-settings-tab="appearance">Aparência</button>
                <button class="settings-tab" type="button" role="tab" aria-selected="false" aria-controls="settings-info" id="settings-tab-info" data-settings-tab="info">Info</button>
              </div>
              <div class="settings-section" id="settings-profile" role="tabpanel" aria-labelledby="settings-tab-profile">
                <p>Perfil</p>
                <label>Seu apelido<input id="profile-nickname" name="nickname" type="text" maxlength="28" autocomplete="nickname" placeholder="Como quer ser chamado?"></label>
                <label>Sua equipe<select id="profile-team" name="team"><option value="">Nenhuma equipe padrão</option></select></label>
              </div>
              <div class="settings-section" id="settings-appearance" role="tabpanel" aria-labelledby="settings-tab-appearance" hidden>
                <p>Aparência</p>
                <div class="settings-palette" aria-labelledby="settings-palette-title">
                  <span id="settings-palette-title">Tema</span>
                  <div class="settings-palette__options" role="radiogroup" aria-label="Tema visual">
                    <button type="button" role="radio" aria-checked="true" class="palette-option is-active" data-palette="default"><i></i>Padrão</button>
                    <button type="button" role="radio" aria-checked="false" class="palette-option" data-palette="dracula"><i></i>Dracula</button>
                    <button type="button" role="radio" aria-checked="false" class="palette-option" data-palette="catppuccin"><i></i>Catppuccin</button>
                    <button type="button" role="radio" aria-checked="false" class="palette-option" data-palette="everforest"><i></i>Everforest</button>
                    <button type="button" role="radio" aria-checked="false" class="palette-option" data-palette="nord"><i></i>Nord</button>
                    <button type="button" role="radio" aria-checked="false" class="palette-option" data-palette="tokyo-night"><i></i>Tokyo Night</button>
                    <button type="button" role="radio" aria-checked="false" class="palette-option" data-palette="gruvbox"><i></i>Gruvbox</button>
                    <button type="button" role="radio" aria-checked="false" class="palette-option" data-palette="solarized"><i></i>Solarized</button>
                    <button type="button" role="radio" aria-checked="false" class="palette-option" data-palette="one-dark"><i></i>One Dark</button>
                    <button type="button" role="radio" aria-checked="false" class="palette-option" data-palette="rose-pine"><i></i>Rosé Pine</button>
                    <button type="button" role="radio" aria-checked="false" class="palette-option" data-palette="monokai"><i></i>Monokai</button>
                  </div>
                </div>
                <label class="settings-font"><span>Fonte da interface</span><select id="settings-font" name="font"><option value="dm-sans">DM Sans</option><option value="inter">Inter</option><option value="manrope">Manrope</option><option value="space-grotesk">Space Grotesk</option><option value="outfit">Outfit</option><option value="plus-jakarta">Plus Jakarta Sans</option><option value="ibm-plex">IBM Plex Sans</option><option value="fira-sans">Fira Sans</option><option value="source-sans">Source Sans 3</option></select></label>
                <label class="settings-texture"><span>Textura dos cards</span><select id="settings-texture" name="texture"><option value="none">Sem textura</option><option value="mist">Névoa suave</option><option value="grain">Grão refinado</option><option value="aurora">Aurora sutil</option><option value="paper">Papel acetinado</option><option value="lines">Linhas delicadas</option><option value="glow">Brilho difuso</option><option value="waves">Ondas suaves</option><option value="topography">Topografia</option></select></label>
              </div>
              <div class="settings-section settings-info" id="settings-info" role="tabpanel" aria-labelledby="settings-tab-info" hidden>
                <p>Informações do produto</p>
                <dl>
                  <div><dt>Produto</dt><dd>Portal de Demandas</dd></div>
                  <div><dt>Dono do produto</dt><dd>TI Hungaro</dd></div>
                  <div><dt>Licença</dt><dd>Uso interno proprietário</dd></div>
                  <div><dt>Versão</dt><dd id="product-version">Carregando…</dd></div>
                </dl>
              </div>
              <div class="settings-panel__footer"><button class="settings-save" type="submit">Salvar preferências</button></div>
            </div>
          </form>
        </div>
      </div>

      <div id="teams" class="bento-grid" aria-live="polite"></div>
    </section>
  </main>

  <script src="../js/script.js"></script>
</body>
</html>
