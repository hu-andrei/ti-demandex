<!doctype html>
<html lang="pt-BR" class="app-loading">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07090f" />
  <meta name="color-scheme" content="dark" />
  <title>Formulário de Issue | DEMANDex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fira+Sans:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Nunito+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&family=Sora:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    (() => {
      const palette = localStorage.getItem("ti-demandas-palette");
      const font = localStorage.getItem("ti-demandas-font");
      if (palette) document.documentElement.dataset.palette = palette;
      if (font) document.documentElement.dataset.font = font;
    })();
  </script>
  <link rel="stylesheet" href="../css/styles.css" />
</head>

<body class="is-issue-form-page">
  <section class="issue-form-page" id="issue-form-dialog" aria-labelledby="issue-form-title">
    <div class="issue-form-page__surface">
      <header class="issue-form-page__header">
        <div>
          <h1 id="issue-form-title">Carregando formulário…</h1>
          <p id="issue-form-description">O template está sendo obtido diretamente do GitHub.</p>
        </div>
        <button class="issue-form-page__github" id="issue-form-github" type="button" aria-label="Abrir formulário original no GitHub" title="Abrir no GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5a9.5 9.5 0 0 0-3 18.5c.48.09.65-.2.65-.46v-1.68c-2.65.58-3.21-1.13-3.21-1.13-.43-1.1-1.05-1.4-1.05-1.4-.86-.59.07-.58.07-.58.95.07 1.45.98 1.45.98.84 1.44 2.2 1.02 2.74.78.08-.61.33-1.02.6-1.25-2.12-.24-4.35-1.06-4.35-4.7 0-1.04.37-1.88.98-2.54-.1-.24-.43-1.2.09-2.5 0 0 .8-.25 2.62.97a9.1 9.1 0 0 1 4.77 0c1.82-1.22 2.62-.97 2.62-.97.52 1.3.19 2.26.09 2.5.61.66.98 1.5.98 2.54 0 3.65-2.23 4.46-4.36 4.7.34.3.64.87.64 1.76v2.62c0 .26.17.55.66.46A9.5 9.5 0 0 0 12 2.5Z"/></svg>
        </button>
      </header>
      <div class="issue-form-page__workspace">
        <form class="issue-form" id="issue-form" novalidate>
          <div class="issue-form-loading" id="issue-form-loading" role="status">Preparando formulário…</div>
        </form>
        <section class="issue-form-preview" id="issue-preview" aria-label="Visualização da issue">
          <div class="issue-form-preview__content" id="issue-preview-content"><p>A visualização será atualizada enquanto você preenche o formulário.</p></div>
        </section>
      </div>
      <footer class="issue-form-page__footer">
        <button class="issue-form-page__secondary issue-form-page__close" type="button">Cancelar</button>
        <button class="issue-form-page__submit" id="issue-form-submit" type="button">Enviar <span aria-hidden="true">↗</span></button>
      </footer>
    </div>
  </section>
  <script src="../runtime-config.js"></script>
  <script type="module" src="../js/issue-form-page.js"></script>
</body>

</html>
